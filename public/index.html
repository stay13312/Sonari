<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d1f">
<title>Sonari</title>
<style>
:root{--bg:#090b1a;--panel:#12152b;--panel2:#181c38;--line:#252a4d;--text:#e8eaff;--muted:#8a90c0;--accent:#5b5cf6;--accent2:#8b5cf6;--danger:#ef4444;--ok:#22c55e}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:radial-gradient(circle at 50% -10%,#1d1b4d,var(--bg) 60%);color:var(--text);min-height:100vh}
button,input,textarea{font:inherit;color:inherit}
.logo{display:flex;align-items:center;gap:10px;font-size:24px;font-weight:600}
.logo svg{width:32px;height:32px}
.wrap{max-width:440px;margin:0 auto;padding:32px 20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px}
.tabs{display:flex;background:var(--panel2);border-radius:10px;padding:4px;margin:20px 0}
.tabs button{flex:1;padding:10px;border:0;background:none;border-radius:8px;color:var(--muted);cursor:pointer}
.tabs button.on{background:var(--accent);color:#fff}
label{display:block;font-size:13px;color:var(--muted);margin:14px 0 6px}
input,textarea,select{width:100%;padding:12px 14px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
.check{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:14px;color:var(--muted)}
.check input{width:auto}
.btn{width:100%;margin-top:18px;padding:13px;border:0;border-radius:10px;background:linear-gradient(90deg,var(--accent),var(--accent2));color:#fff;font-weight:600;cursor:pointer}
.btn.ghost{background:var(--panel2);border:1px solid var(--line)}
.btn.danger{background:transparent;border:1px solid var(--danger);color:var(--danger)}
.btn.sm{width:auto;margin-top:0;padding:8px 12px;font-size:13px}
.err{color:var(--danger);font-size:14px;margin-top:12px;min-height:18px}
.okmsg{color:var(--ok)}
.app{padding:16px 16px 90px;max-width:900px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:center;padding:8px 0 18px}
.avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-weight:700;flex-shrink:0}
.avatar.big{width:72px;height:72px;font-size:28px}
h1{font-size:24px;margin-bottom:4px}
h2{font-size:16px;margin-bottom:10px}
.sub{color:var(--muted);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 8px;text-align:center;font-size:13px;cursor:pointer}
.tile .ic{width:36px;height:36px;margin:0 auto 8px;border-radius:10px;background:var(--panel2);display:grid;place-items:center;font-size:18px}
.soon{font-size:11px;color:var(--muted)}
.section{margin-top:22px}
.row{display:flex;align-items:center;gap:12px;padding:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;font-size:14px;cursor:pointer}
.row.static{cursor:default}
.row small{color:var(--muted);display:block}
.row .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:rgba(14,16,36,.96);border-top:1px solid var(--line);padding:8px 0 calc(8px + env(safe-area-inset-bottom));backdrop-filter:blur(10px);z-index:20}
.nav button{flex:1;border:0;background:none;color:var(--muted);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
.nav button span{font-size:20px}
.nav button.on{color:#a5a6ff}
.empty{text-align:center;color:var(--muted);padding:40px 20px}
.badge{font-size:11px;color:var(--ok);margin-left:auto}
.chip{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:20px;padding:3px 9px;flex-shrink:0}
.sheet{position:fixed;inset:0;background:rgba(4,5,15,.7);display:grid;place-items:end center;z-index:40}
.sheet .card{width:100%;max-width:440px;border-radius:18px 18px 0 0;margin:0}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;word-break:break-all}
.chat{display:flex;flex-direction:column;height:calc(100vh - 150px);min-height:320px}
.msgs{flex:1;overflow-y:auto;padding:4px 0 8px;display:flex;flex-direction:column;gap:2px}
.msg{display:flex;gap:10px;padding:6px 8px;border-radius:10px;position:relative}
.msg:hover{background:rgba(255,255,255,.03)}
.msg .bubble{flex:1;min-width:0}
.msg .who{font-size:13px;font-weight:600;color:#a5a6ff}
.msg .when{font-size:11px;color:var(--muted);margin-left:6px;font-weight:400}
.msg .txt{font-size:15px;line-height:1.4;word-wrap:break-word;white-space:pre-wrap;margin-top:2px}
.msg .acts{display:flex;gap:4px;opacity:.35;transition:opacity .15s}
.msg:hover .acts{opacity:1}
.msg .acts button{border:0;background:var(--panel2);border-radius:6px;padding:4px 8px;font-size:12px;color:var(--muted);cursor:pointer}
.msg .reply{border-left:2px solid var(--accent);padding-left:8px;margin-bottom:4px;font-size:12px;color:var(--muted);cursor:pointer}
.composer{display:flex;gap:8px;padding:10px 0 0;border-top:1px solid var(--line);margin-top:6px}
.composer textarea{flex:1;resize:none;max-height:110px;padding:11px 13px}
.composer button{width:auto;margin-top:0;padding:0 18px;border-radius:10px}
.composer .clip{width:auto;margin-top:0;padding:0 14px;border-radius:10px;background:var(--panel2);border:1px solid var(--line)}
.replybar{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);padding:6px 8px;background:var(--panel2);border-radius:8px;margin-bottom:6px}
.replybar button{border:0;background:none;color:var(--muted);cursor:pointer;font-size:14px}
.daysep{text-align:center;font-size:11px;color:var(--muted);margin:10px 0}
.searchbox{margin-bottom:8px}
.attach{display:flex;gap:8px;align-items:center;padding:8px;background:var(--panel2);border-radius:10px;margin-bottom:6px;font-size:13px}
.attach img{max-width:70px;max-height:70px;border-radius:8px;display:block;object-fit:cover}
.attach .fname{color:var(--muted);font-size:12px}
.attach button{border:0;background:none;color:var(--muted);cursor:pointer;font-size:15px}
.msgimg{max-width:100%;max-height:280px;border-radius:10px;margin-top:6px;display:block;cursor:pointer}
.msgfile{display:inline-flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-top:6px;font-size:13px;cursor:pointer;color:var(--text)}
</style>
</head>
<body>
<div id="root"></div>
<script>
const LOGO='<svg viewBox="0 0 32 32"><defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#6366f1"/><stop offset="1" stop-color="#a855f7"/></linearGradient></defs><path fill="url(#g)" d="M16 26C12 18 6 14 2 6c6 0 11 4 14 12 3-8 8-12 14-12-4 8-10 12-14 20z"/></svg>';
const root=document.getElementById('root');
let me=null, tab='home', servers=[], opened=null, chat=null, es=null, replyTo=null, editing=null, pending=null, dm=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const avatar=(name,cls='')=>'<div class="avatar '+cls+'">'+esc((name||'?')[0].toUpperCase())+'</div>';
const iconOf=s=>s.icon?esc(s.icon):esc(s.name[0].toUpperCase());
async function api(url,method='GET',body){
  const r=await fetch(url,{method,headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined});
  const d=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(d.error||('Ошибка '+r.status));
  return d;
}
function form(id){const o={};document.querySelectorAll('#'+id+' [name]').forEach(i=>o[i.name]=i.type==='checkbox'?i.checked:i.value.trim());return o}
function listen(){
  if(es) es.close();
  es=new EventSource('/api/events');
  es.addEventListener('message',e=>{onIncoming('message',JSON.parse(e.data))});
  es.addEventListener('message-edit',e=>{onIncoming('message-edit',JSON.parse(e.data))});
  es.addEventListener('message-delete',e=>{onIncoming('message-delete',JSON.parse(e.data))});
  es.addEventListener('dm',e=>{onDm('dm',JSON.parse(e.data))});
  es.addEventListener('dm-edit',e=>{onDm('dm-edit',JSON.parse(e.data))});
  es.addEventListener('dm-delete',e=>{onDm('dm-delete',JSON.parse(e.data))});
  es.addEventListener('friend-request',e=>{if(tab==='friends')render()});
  es.addEventListener('friend-accept',e=>{if(tab==='friends')render()});
  es.onerror=()=>{/* браузер сам переподключится */};
}
function onIncoming(kind,d){
  if(!chat||chat.channel.id!==d.channel_id)return;
  if(kind==='message'){chat.messages.push(d);renderThread();scrollDown()}
  if(kind==='message-edit'){
    const i=chat.messages.findIndex(m=>m.id===d.id);
    if(i>=0){chat.messages[i]=d;renderThread()}
  }
  if(kind==='message-delete'){
    chat.messages=chat.messages.filter(m=>m.id!==d.id);
    renderThread();
  }
}
function onDm(kind,d){
  if(!dm||dm.info.id!==d.dm_id)return;
  if(kind==='dm'){dm.messages.push(d);renderDmThread();dmScroll()}
  if(kind==='dm-edit'){
    const i=dm.messages.findIndex(m=>m.id===d.id);
    if(i>=0){dm.messages[i]=d;renderDmThread()}
  }
  if(kind==='dm-delete'){
    dm.messages=dm.messages.filter(m=>m.id!==d.id);
    renderDmThread();
  }
}
function closeSheet(){document.querySelectorAll('.sheet').forEach(s=>s.remove())}
function sheet(inner){
  closeSheet();
  const d=document.createElement('div');d.className='sheet';
  d.innerHTML='<div class="card">'+inner+'</div>';
  d.onclick=e=>{if(e.target===d)closeSheet()};
  document.body.appendChild(d);return d;
}
function authView(mode='login'){
  root.innerHTML='<div class="wrap"><div class="logo">'+LOGO+'Sonari</div><p class="sub" style="margin-top:6px">One space. Every connection.</p>'+
  '<div class="tabs"><button id="tl" class="'+(mode==='login'?'on':'')+'">Вход</button><button id="tr" class="'+(mode==='reg'?'on':'')+'">Регистрация</button></div>'+
  '<div class="card" id="f">'+(mode==='login'
   ?'<label>Почта или ник</label><input name="login" autocomplete="username"><label>Пароль</label><input name="password" type="password" autocomplete="current-password">'
   :'<label>Почта</label><input name="email" type="email" autocomplete="email"><label>Ник</label><input name="username" autocomplete="username" placeholder="латиница, цифры, _ ."><label>Пароль</label><input name="password" type="password" autocomplete="new-password" placeholder="минимум 8 символов">')+
  '<label class="check"><input type="checkbox" name="remember" checked> Оставаться в аккаунте</label>'+
  '<button class="btn" id="go">'+(mode==='login'?'Войти':'Создать аккаунт')+'</button><div class="err" id="e"></div></div></div>';
  tl.onclick=()=>authView('login'); tr.onclick=()=>authView('reg');
  go.onclick=async()=>{
    e.textContent='';go.disabled=true;
    try{await api(mode==='login'?'/api/login':'/api/register','POST',form('f'));await boot();}
    catch(x){e.textContent=x.message;go.disabled=false}
  };
}
function shell(content){
  const tabs=[['home','🏠','Главная'],['servers','🗂','Серверы'],['chats','💬','Чаты'],['friends','👥','Друзья'],['more','☰','Ещё']];
  root.innerHTML='<div class="app"><div class="top"><div class="logo">'+LOGO+'Sonari</div>'+avatar(me.username)+'</div>'+content+'</div>'+
  '<nav class="nav">'+tabs.map(t=>'<button data-t="'+t[0]+'" class="'+(tab===t[0]?'on':'')+'"><span>'+t[1]+'</span>'+t[2]+'</button>').join('')+'</nav>';
  document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{closeSheet();tab=b.dataset.t;render()});
}
async function loadServers(){ servers=await api('/api/servers'); }
const serverRow=s=>'<div class="row" data-s="'+s.id+'">'+avatar(iconOf(s))+'<div class="grow">'+esc(s.name)+'<small>'+s.members+' '+plural(s.members,'участник','участника','участников')+'</small></div><span class="chip">'+(s.owner?'владелец':'участник')+'</span></div>';
function plural(n,a,b,c){const m=n%100,k=n%10;if(m>10&&m<20)return c;if(k===1)return a;if(k>1&&k<5)return b;return c}
async function render(){
  if(dm) return dmView();
  if(chat) return chatView();
  if(opened) return serverView();
  if(tab==='home'){
    await loadServers();
    shell('<h1>Привет, '+esc(me.username)+'!</h1><p class="sub">Рад видеть тебя снова.</p>'+
      '<div class="grid">'+
        '<div class="tile" id="mk"><div class="ic">＋</div>Создать сервер</div>'+
        '<div class="tile" id="jn"><div class="ic">🔍</div>Найти сервер</div>'+
        '<div class="tile"><div class="ic">💬</div>Быстрый чат<div class="soon">скоро</div></div>'+
      '</div>'+
      '<div class="section"><h2>Мои серверы</h2>'+(servers.length?servers.map(serverRow).join(''):'<div class="empty">Серверов пока нет — создай первый.</div>')+'</div>');
    mk.onclick=createSheet; jn.onclick=joinSheet; bindRows();
    return;
  }
  if(tab==='servers'){
    await loadServers();
    shell('<h2>Мои серверы</h2>'+servers.map(serverRow).join('')+'<button class="btn" id="mk">Создать сервер</button><button class="btn ghost" id="jn">Присоединиться по ссылке</button>');
    mk.onclick=createSheet; jn.onclick=joinSheet; bindRows();
    return;
  }
  if(tab==='friends') return friendsView();
  if(tab==='chats') return chatsView();
  if(tab==='more') return moreView();
}
function chatView(){
  const c=chat.channel;
  shell(
    '<div class="row static"><div class="grow"><b># '+esc(c.name)+'</b><small>'+esc((opened&&opened.name)||'')+'</small></div><span class="chip" id="live">● live</span></div>'+
    '<button class="btn ghost" id="bk">← К каналам</button>'+
    '<div class="searchbox"><input id="q" placeholder="Поиск по сообщениям"></div>'+
    '<div class="chat"><div class="msgs" id="msgs"></div>'+
    '<div id="attachwrap"></div>'+
    '<div id="replywrap"></div>'+
    '<div class="composer"><button class="btn clip" id="clip">📎</button><textarea id="inp" rows="1" placeholder="Написать в #'+esc(c.name)+'"></textarea><button class="btn" id="send">➤</button>'+
    '<input type="file" id="fpick" style="display:none"></div>'+
    '</div>');
  bk.onclick=()=>{chat=null;replyTo=null;editing=null;render()};
  renderThread();scrollDown();
  const inp=document.getElementById('inp');
  inp.oninput=()=>{inp.style.height='auto';inp.style.height=Math.min(inp.scrollHeight,110)+'px'};
  inp.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}};
  send.onclick=sendMessage;
  q.onchange=()=>searchMessages(q.value.trim());
  clip.onclick=()=>fpick.click();
  fpick.onchange=()=>pickFile(fpick.files[0]);
  renderReplyBar();renderAttachBar();
}
function renderAttachBar(){
  const w=document.getElementById('attachwrap');if(!w)return;
  if(!pending){w.innerHTML='';return}
  w.innerHTML='<div class="attach">'+(pending.kind==='image'?'<img src="'+pending.preview+'">':'📄')+
    '<div class="grow"><div>'+esc(pending.name)+'</div><div class="fname">'+Math.round(pending.size/1024)+' КБ</div></div>'+
    '<button id="rm">✕</button></div>';
  rm.onclick=()=>{pending=null;renderAttachBar()};
}
function pickFile(file){
  if(!file)return;
  if(file.size>5*1024*1024){alert('Файл больше 5 МБ');return}
  const isImg=/^image\//.test(file.type);
  const reader=new FileReader();
  reader.onload=()=>{
    const data=reader.result;
    if(isImg){
      const img=new Image();
      img.onload=()=>{
        const max=1400;let w=img.width,h=img.height;
        if(w>max){h=Math.round(h*max/w);w=max}
        if(h>max){w=Math.round(w*max/h);h=max}
        const cv=document.createElement('canvas');cv.width=w;cv.height=h;
        cv.getContext('2d').drawImage(img,0,0,w,h);
        const shrunk=cv.toDataURL('image/jpeg',0.82);
        pending={kind:'image',name:file.name,size:Math.round(shrunk.length*0.75),body:shrunk,preview:shrunk};
        renderAttachBar();
      };
      img.src=data;
    }else{
      pending={kind:'file',name:file.name,size:file.size,body:data,preview:null};
      renderAttachBar();
    }
  };
  reader.readAsDataURL(file);
}
function renderReplyBar(){
  const w=document.getElementById('replywrap');if(!w)return;
  if(editing){w.innerHTML='<div class="replybar">Правка сообщения<button id="cx">✕</button></div>';cx.onclick=()=>{editing=null;document.getElementById('inp').value='';renderReplyBar()};return}
  if(replyTo){w.innerHTML='<div class="replybar">Ответ '+esc(replyTo.username)+': '+esc(replyTo.text.slice(0,60))+'<button id="cx">✕</button></div>';cx.onclick=()=>{replyTo=null;renderReplyBar()};return}
  w.innerHTML='';
}
function dayOf(ts){return new Date(ts).toLocaleDateString('ru',{day:'numeric',month:'long'})}
function renderThread(){
  const box=document.getElementById('msgs');if(!box)return;
  let last='';
  box.innerHTML=chat.messages.map(m=>{
    const d=dayOf(m.created_at);
    const sep=d!==last?(last=d,'<div class="daysep">'+d+'</div>'):'';
    const mine=m.user_id===me.id;
    return sep+'<div class="msg" data-m="'+m.id+'">'+avatar(m.username)+
      '<div class="bubble">'+
        (m.reply_to?'<div class="reply" data-go="'+m.reply_to+'">'+esc(m.reply_username)+': '+esc(m.reply_text||'')+'</div>':'')+
        '<div class="who">'+esc(m.username)+(mine?' <span class="when">это ты</span>':'')+'<span class="when">'+new Date(m.created_at).toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'})+(m.edited_at?' · изменено':'')+'</span></div>'+
        (m.text?'<div class="txt">'+esc(m.text)+'</div>':'')+
        (m.file?(m.file.type&&m.file.type.indexOf('image/')===0
          ?'<img class="msgimg" data-f="'+m.file.id+'" src="" alt="">'
          :'<span class="msgfile" data-f="'+m.file.id+'">📄 '+esc(m.file.name)+' · '+Math.round(m.file.size/1024)+' КБ</span>'):'')+
      '</div>'+
      '<div class="acts">'+
        '<button data-r="'+m.id+'">↩</button>'+
        (mine?'<button data-e="'+m.id+'">✎</button><button data-d="'+m.id+'">✕</button>':'')+
      '</div></div>';
  }).join('')||'<div class="empty">Сообщений пока нет. Напиши первым!</div>';
  box.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{
    const m=chat.messages.find(x=>x.id===Number(b.dataset.r));
    replyTo={id:m.id,username:m.username,text:m.text};editing=null;renderReplyBar();
  });
  box.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>{
    const m=chat.messages.find(x=>x.id===Number(b.dataset.e));
    editing=m.id;replyTo=null;document.getElementById('inp').value=m.text;renderReplyBar();
  });
  box.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>delMessage(b.dataset.d));
  box.querySelectorAll('[data-f]').forEach(el=>{
    const mid=el.closest('[data-m]');
    const msg=chat.messages.find(x=>x.id===Number(mid&&mid.dataset.m));
    const f=msg&&msg.file;if(!f)return;
    el.onclick=()=>openAttachment(f.id,f.name,f.type);
    if(el.tagName==='IMG'){
      el.onclick=null;
      api('/api/files/'+f.id).then(d=>{el.src=d.data.indexOf('data:')===0?d.data:('data:'+(f.type||'image/jpeg')+';base64,'+d.data)}).catch(()=>{});
    }
  });
  box.querySelectorAll('[data-go]').forEach(el=>el.onclick=()=>{
    const t=document.querySelector('[data-m="'+el.dataset.go+'"]');
    if(t){t.scrollIntoView({block:'center'});t.style.background='rgba(91,92,246,.15)';setTimeout(()=>t.style.background='',900)}
  });
}
async function sendMessage(){
  const inp=document.getElementById('inp');
  const text=inp.value.trim();
  if(!text&&!pending)return;
  inp.disabled=true;
  try{
    if(editing){
      await api('/api/messages/'+editing,'PATCH',{text});
      editing=null;
    }else{
      let fileId=null;
      if(pending){
        const f=await api('/api/channels/'+chat.channel.id+'/files','POST',{name:pending.name,type:pending.kind==='image'?'image/jpeg':'application/octet-stream',data:pending.body});
        fileId=f.id;
      }
      await api('/api/channels/'+chat.channel.id+'/messages','POST',{text,reply_to:replyTo?replyTo.id:null,file_id:fileId});
      replyTo=null;pending=null;
    }
    inp.value='';inp.style.height='auto';
    renderReplyBar();renderAttachBar();
  }catch(x){alert(x.message)}
  inp.disabled=false;inp.focus();
}
async function openAttachment(id,name,type){
  try{
    const f=await api('/api/files/'+id);
    const url=f.data.indexOf('data:')===0?f.data:('data:'+(type||'application/octet-stream')+';base64,'+f.data);
    const a=document.createElement('a');a.href=url;a.download=name||f.name;document.body.appendChild(a);a.click();a.remove();
  }catch(x){alert(x.message)}
}
async function delMessage(id){
  if(!confirm('Удалить сообщение?'))return;
  try{await api('/api/messages/'+id,'DELETE')}catch(x){alert(x.message)}
}
async function searchMessages(q){
  if(!q){const d=await api('/api/channels/'+chat.channel.id+'/messages?limit=50');chat.messages=d.messages;renderThread();scrollDown();return}
  const r=await api('/api/channels/'+chat.channel.id+'/search?q='+encodeURIComponent(q));
  chat.messages=r.messages;renderThread();
}
function bindRows(){document.querySelectorAll('[data-s]').forEach(el=>el.onclick=()=>openServer(el.dataset.s))}
function scrollDown(){const el=document.querySelector('.msgs');if(el)el.scrollTop=el.scrollHeight}
async function openChannel(cid){
  try{
    const d=await api('/api/channels/'+cid+'/messages?limit=50');
    chat={channel:d.channel,messages:d.messages,has_more:d.has_more};
    replyTo=null;editing=null;pending=null;
    render();
    setTimeout(scrollDown,30);
  }catch(x){alert(x.message)}
}
async function friendsView(){
  const d=await api('/api/friends');
  shell('<h2>Друзья</h2>'+
    '<button class="btn" id="add">Добавить в друзья</button>'+
    (d.incoming.length?'<div class="section"><h2>Заявки · '+d.incoming.length+'</h2>'+d.incoming.map(u=>
      '<div class="row static">'+avatar(u.username)+'<div class="grow">'+esc(u.username)+'<small>хочет дружить</small></div>'+
      '<button class="btn sm" data-ok="'+u.id+'">Принять</button><button class="btn ghost sm" data-no="'+u.id+'">✕</button></div>').join('')+'</div>':'')+
    (d.outgoing.length?'<div class="section"><h2>Отправленные</h2>'+d.outgoing.map(u=>
      '<div class="row static">'+avatar(u.username)+'<div class="grow">'+esc(u.username)+'<small>ждём ответа</small></div><span class="chip">отправлено</span></div>').join('')+'</div>':'')+
    '<div class="section"><h2>Мои друзья · '+d.friends.length+'</h2>'+
    (d.friends.length?d.friends.map(u=>
      '<div class="row" data-dm="'+u.id+'">'+avatar(u.username)+'<div class="grow">'+esc(u.username)+'<small>'+esc(u.bio||'личные сообщения')+'</small></div><span class="chip">написать</span></div>').join('')
     :'<div class="empty">Друзей пока нет. Нажми «Добавить в друзья» и введи ник.</div>')+'</div>');
  add.onclick=addFriendSheet;
  document.querySelectorAll('[data-ok]').forEach(b=>b.onclick=async()=>{
    try{await api('/api/friends/accept','POST',{id:Number(b.dataset.ok)});render()}catch(x){alert(x.message)}
  });
  document.querySelectorAll('[data-no]').forEach(b=>b.onclick=async()=>{
    try{await api('/api/friends/decline','POST',{id:Number(b.dataset.no)});render()}catch(x){alert(x.message)}
  });
  document.querySelectorAll('[data-dm]').forEach(el=>el.onclick=()=>openDmWith(Number(el.dataset.dm)));
}
async function chatsView(){
  const list=await api('/api/dms');
  shell('<h2>Чаты</h2>'+
    (list.length?list.map(d=>
      '<div class="row" data-dm="'+d.id+'">'+avatar(d.with.username)+
      '<div class="grow">'+esc(d.with.username)+'<small>'+esc(d.last?d.last.text.slice(0,60):'')+'</small></div></div>').join('')
     :'<div class="empty">Личных переписок пока нет. Добавь друга во вкладке «Друзья».</div>'));
  document.querySelectorAll('[data-dm]').forEach(el=>el.onclick=()=>openDm(Number(el.dataset.dm)));
}
function addFriendSheet(){
  const d=sheet('<h2>Добавить в друзья</h2><label>Ник друга</label><input name="username" placeholder="латиница, цифры, _ ."><button class="btn" id="ok">Отправить заявку</button><div class="err" id="e"></div>');
  d.querySelector('#ok').onclick=async()=>{
    const e=d.querySelector('#e');e.textContent='';
    try{
      const r=await api('/api/friends/request','POST',{username:d.querySelector('[name=username]').value.trim()});
      closeSheet();
      if(r.accepted) alert('Вы теперь друзья!');
      tab='friends';render();
    }catch(x){e.textContent=x.message}
  };
}
async function openDmWith(userId){
  try{const s=await api('/api/dms/open','POST',{user_id:userId});await openDm(s.id)}
  catch(x){alert(x.message)}
}
async function openDm(id){
  try{
    const d=await api('/api/dms/'+id+'/messages?limit=50');
    dm={info:d.dm,messages:d.messages,has_more:d.has_more};
    editing=null;
    render();
    setTimeout(dmScroll,30);
  }catch(x){alert(x.message)}
}
function dmScroll(){const el=document.querySelector('.msgs');if(el)el.scrollTop=el.scrollHeight}
function dmView(){
  const other=dm.info.with;
  shell(
    '<div class="row static">'+avatar(other.username)+'<div class="grow"><b>'+esc(other.username)+'</b><small>личная переписка</small></div><span class="chip">● live</span></div>'+
    '<button class="btn ghost" id="bk">← Назад</button>'+
    '<div class="chat"><div class="msgs" id="msgs"></div>'+
    '<div id="replywrap"></div>'+
    '<div class="composer"><textarea id="inp" rows="1" placeholder="Написать '+esc(other.username)+'"></textarea><button class="btn" id="send">➤</button></div>'+
    '</div>');
  bk.onclick=()=>{dm=null;editing=null;render()};
  const inp=document.getElementById('inp');
  inp.oninput=()=>{inp.style.height='auto';inp.style.height=Math.min(inp.scrollHeight,110)+'px'};
  inp.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendDm()}};
  send.onclick=sendDm;
  renderDmThread();dmScroll();
}
function renderDmThread(){
  const box=document.getElementById('msgs');if(!box)return;
  let last='';
  box.innerHTML=dm.messages.map(m=>{
    const d=dayOf(m.created_at);
    const sep=d!==last?(last=d,'<div class="daysep">'+d+'</div>'):'';
    const mine=m.user_id===me.id;
    return sep+'<div class="msg" data-m="'+m.id+'">'+avatar(m.username)+
      '<div class="bubble"><div class="who">'+esc(m.username)+(mine?' <span class="when">это ты</span>':'')+
      '<span class="when">'+new Date(m.created_at).toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'})+(m.edited_at?' · изменено':'')+'</span></div>'+
      '<div class="txt">'+esc(m.text)+'</div></div>'+
      '<div class="acts">'+(mine?'<button data-de="'+m.id+'">✎</button><button data-dd="'+m.id+'">✕</button>':'')+'</div></div>';
  }).join('')||'<div class="empty">Напиши первым!</div>';
  box.querySelectorAll('[data-de]').forEach(b=>b.onclick=()=>{
    const m=dm.messages.find(x=>x.id===Number(b.dataset.de));
    editing=m.id;document.getElementById('inp').value=m.text;renderReplyBar();
  });
  box.querySelectorAll('[data-dd]').forEach(b=>b.onclick=()=>delDm(b.dataset.dd));
}
async function sendDm(){
  const inp=document.getElementById('inp');
  const text=inp.value.trim();
  if(!text)return;
  inp.disabled=true;
  try{
    if(editing){
      await api('/api/dm-messages/'+editing,'PATCH',{text});
      editing=null;
    }else{
      await api('/api/dms/'+dm.info.id+'/messages','POST',{text});
    }
    inp.value='';inp.style.height='auto';renderReplyBar();
  }catch(x){alert(x.message)}
  inp.disabled=false;inp.focus();
}
async function delDm(id){
  if(!confirm('Удалить сообщение?'))return;
  try{await api('/api/dm-messages/'+id,'DELETE')}catch(x){alert(x.message)}
}
async function openServer(id){
  try{ opened=await api('/api/servers/'+id); tab='servers'; render(); }
  catch(x){ alert(x.message) }
}
async function serverView(){
  const s=opened;
  const text=s.channels.filter(c=>c.type==='text');
  const voice=s.channels.filter(c=>c.type==='voice');
  shell(
    '<div class="row static"><div class="avatar">'+iconOf(s)+'</div><div class="grow"><b>'+esc(s.name)+'</b><small>'+s.members+' '+plural(s.members,'участник','участника','участников')+' · '+(s.myRole==='owner'?'владелец':'участник')+'</small></div></div>'+
    '<button class="btn ghost" id="bk">← Назад к списку</button>'+
    '<div class="section"><h2>Текстовые каналы</h2>'+(text.length?text.map(c=>'<div class="row" data-c="'+c.id+'">#<div class="grow">'+esc(c.name)+'</div><span class="chip">открыть</span></div>').join(''):'<div class="empty">Каналов нет</div>')+'</div>'+
    '<div class="section"><h2>Голосовые каналы</h2>'+(voice.length?voice.map(c=>'<div class="row static">🔊<div class="grow">'+esc(c.name)+'</div><span class="chip">голос скоро</span></div>').join(''):'<div class="empty">Каналов нет</div>')+'</div>'+
    (canManage()?'<div class="section"><h2>Управление</h2><button class="btn" id="ac">Создать канал</button><button class="btn ghost" id="iv">Пригласительная ссылка</button><button class="btn ghost" id="rn">Переименовать сервер</button>'+(s.owner?'<button class="btn danger" id="dl">Удалить сервер</button>':'<button class="btn danger" id="lv">Покинуть сервер</button>')+'</div>':'<div class="section"><button class="btn danger" id="lv">Покинуть сервер</button></div>')+
    '<div class="section"><h2>Участники · '+s.members+'</h2>'+((s.memberList||[]).map(u=>'<div class="row static">'+avatar(u.username)+'<div class="grow">'+esc(u.username)+'<small>'+(u.role==='owner'?'владелец':'участник')+'</small></div></div>').join('')||'')+'</div>'
  );
  bk.onclick=()=>{opened=null;render()};
  document.querySelectorAll('[data-c]').forEach(el=>el.onclick=()=>openChannel(el.dataset.c));
  if(document.getElementById('ac')) ac.onclick=addChannelSheet;
  if(document.getElementById('iv')) iv.onclick=inviteSheet;
  if(document.getElementById('rn')) rn.onclick=renameSheet;
  if(document.getElementById('lv')) lv.onclick=leaveServer;
  if(document.getElementById('dl')) dl.onclick=deleteServer;
}
const canManage=()=>opened && (opened.myRole==='owner'||opened.myRole==='admin');
function createSheet(){
  const d=sheet('<h2>Создать сервер</h2><label>Название</label><input name="name" maxlength="40" placeholder="Например: Друзья"><label>Иконка (эмодзи или 1–2 буквы)</label><input name="icon" maxlength="4" placeholder="🎮"><button class="btn" id="ok">Создать</button><div class="err" id="e"></div>');
  d.querySelector('#ok').onclick=async()=>{
    const e=d.querySelector('#e'); e.textContent='';
    const name=d.querySelector('[name=name]').value.trim();
    const icon=d.querySelector('[name=icon]').value.trim();
    try{const s=await api('/api/servers','POST',{name,icon});closeSheet();await loadServers();await openServer(s.id);}
    catch(x){e.textContent=x.message}
  };
}
function joinSheet(){
  const d=sheet('<h2>Присоединиться к серверу</h2><p class="sub">Вставь приглашение: код или ссылку целиком.</p><label>Код или ссылка</label><input name="inv" placeholder="a1b2c3d4e5"><button class="btn" id="ok">Войти на сервер</button><div class="err" id="e"></div>');
  d.querySelector('#ok').onclick=async()=>{
    const e=d.querySelector('#e'); e.textContent='';
    let v=d.querySelector('[name=inv]').value.trim();
    const mm=v.match(/[a-f0-9]{5,32}/i); if(mm) v=mm[0];
    try{const r=await api('/api/join/'+encodeURIComponent(v),'POST');closeSheet();await loadServers();await openServer(r.id);}
    catch(x){e.textContent=x.message}
  };
}
function addChannelSheet(){
  const d=sheet('<h2>Создать канал</h2><label>Название</label><input name="name" maxlength="40" placeholder="Например: флудилка"><label>Тип</label><select name="type"><option value="text">Текстовый</option><option value="voice">Голосовой</option></select><button class="btn" id="ok">Создать</button><div class="err" id="e"></div>');
  d.querySelector('#ok').onclick=async()=>{
    const e=d.querySelector('#e'); e.textContent='';
    const name=d.querySelector('[name=name]').value.trim();
    const type=d.querySelector('[name=type]').value;
    try{await api('/api/servers/'+opened.id+'/channels','POST',{name,type});closeSheet();await openServer(opened.id);}
    catch(x){e.textContent=x.message}
  };
}
function inviteSheet(){
  const base=location.origin;
  const d=sheet('<h2>Приглашение на сервер</h2><p class="sub">Отправь этот код другу.</p><div class="card" style="margin-top:12px"><div class="mono" id="code">'+esc(opened.invite)+'</div></div><p class="sub" style="margin-top:10px">Ссылка: <span class="mono">'+esc(base+'/?inv='+opened.invite)+'</span></p><button class="btn" id="cp">Скопировать код</button><button class="btn ghost" id="nw">Сделать новый код</button><div class="err" id="e"></div>');
  d.querySelector('#cp').onclick=async()=>{try{await navigator.clipboard.writeText(opened.invite);d.querySelector('#e').innerHTML='<span class="okmsg">Код скопирован</span>';}catch(_){d.querySelector('#e').textContent='Скопируй код вручную'}};
  d.querySelector('#nw').onclick=async()=>{try{const r=await api('/api/servers/'+opened.id+'/invite','POST');opened.invite=r.invite;closeSheet();inviteSheet();}catch(x){d.querySelector('#e').textContent=x.message}};
}
function renameSheet(){
  const d=sheet('<h2>Название сервера</h2><label>Новое название</label><input name="name" maxlength="40" value="'+esc(opened.name)+'"><button class="btn" id="ok">Сохранить</button><div class="err" id="e"></div>');
  d.querySelector('#ok').onclick=async()=>{
    const e=d.querySelector('#e'); e.textContent='';
    try{await api('/api/servers/'+opened.id,'PATCH',{name:d.querySelector('[name=name]').value.trim()});closeSheet();await openServer(opened.id);}
    catch(x){e.textContent=x.message}
  };
}
async function leaveServer(){
  if(!confirm('Покинуть сервер «'+opened.name+'»?'))return;
  try{await api('/api/servers/'+opened.id+'/leave','POST');opened=null;await loadServers();render();}
  catch(x){alert(x.message)}
}
async function deleteServer(){
  if(!confirm('Удалить сервер «'+opened.name+'» вместе со всеми каналами? Это необратимо.'))return;
  try{await api('/api/servers/'+opened.id,'DELETE');opened=null;await loadServers();render();}
  catch(x){alert(x.message)}
}
function device(ua=''){if(/iPhone|iPad/.test(ua))return 'iOS';if(/Android/.test(ua))return 'Android';if(/Windows/.test(ua))return 'Windows';if(/Mac/.test(ua))return 'macOS';if(/Linux/.test(ua))return 'Linux';return 'Устройство'}
async function moreView(){
  shell('<div class="card" style="text-align:center">'+avatar(me.username,'big')+'<h1 style="margin-top:10px">'+esc(me.username)+'</h1><p class="sub">'+esc(me.email)+'</p></div>'+
  '<div class="section"><h2>Профиль</h2><div class="card" id="pf"><label>Ник</label><input name="username" value="'+esc(me.username)+'"><label>О себе</label><textarea name="bio" rows="3" maxlength="190">'+esc(me.bio)+'</textarea><button class="btn" id="sp">Сохранить</button><div class="err" id="pe"></div></div></div>'+
  '<div class="section"><h2>Смена пароля</h2><div class="card" id="pw"><label>Текущий пароль</label><input name="current" type="password"><label>Новый пароль</label><input name="next" type="password"><button class="btn" id="cp">Сменить пароль</button><div class="err" id="we"></div></div></div>'+
  '<div class="section"><h2>Активные сессии</h2><div id="ss" class="sub">Загрузка…</div><button class="btn ghost" id="la">Выйти со всех других устройств</button></div>'+
  '<div class="section"><button class="btn ghost" id="lo">Выйти из аккаунта</button><button class="btn danger" id="del">Удалить аккаунт</button></div>');
  sp.onclick=async()=>{pe.textContent='';try{me=await api('/api/me','PATCH',form('pf'));pe.innerHTML='<span class="okmsg">Сохранено</span>'}catch(x){pe.textContent=x.message}};
  cp.onclick=async()=>{we.textContent='';try{await api('/api/password','POST',form('pw'));we.innerHTML='<span class="okmsg">Пароль изменён, другие устройства отключены</span>'}catch(x){we.textContent=x.message}};
  la.onclick=async()=>{await api('/api/logout-all','POST');loadSessions()};
  lo.onclick=async()=>{await api('/api/logout','POST');me=null;authView()};
  del.onclick=async()=>{const p=prompt('Введи пароль для удаления аккаунта. Это необратимо.');if(!p)return;try{await api('/api/me','DELETE',{password:p});me=null;authView()}catch(x){alert(x.message)}};
  loadSessions();
}
async function loadSessions(){
  const list=await api('/api/sessions');
  document.getElementById('ss').innerHTML=list.map(s=>'<div class="row static">📱<div class="grow">'+esc(device(s.user_agent))+'<small>'+new Date(s.created_at).toLocaleString('ru')+'</small></div>'+(s.current?'<span class="badge">это устройство</span>':'')+'</div>').join('');
}
async function boot(){
  try{ me=await api('/api/me'); listen(); await loadServers(); const inv=new URLSearchParams(location.search).get('inv');
    if(inv){ try{ const r=await api('/api/join/'+encodeURIComponent(inv),'POST'); history.replaceState({},'','/'); tab='servers'; await loadServers(); await openServer(r.id); return; }catch(x){ alert(x.message) } }
    tab='home'; render();
  }catch{ authView() }
}
boot();
</script>
</body>
</html>
